[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "okto-nexus-connector"
version = "0.1.0.dev0"
description = "Remote harness connector application for Okto Nexus (CLI, daemon, outbound WSS control)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Okto Labs"}]
license = "Elastic-2.0"
license-files = ["LICENSE"]
dependencies = [
    "nexus-connector-core==0.2.8.dev0",
    "websockets>=13,<18",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "build>=1"]

[project.scripts]
okto-nexus-connector = "okto_nexus_connector.cli.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
okto_nexus_connector = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "process: spawns real OS subprocesses (daemon lifecycle)",
    "packaging: builds/installs real wheels (slow)",
]
