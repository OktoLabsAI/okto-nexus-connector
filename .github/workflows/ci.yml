name: ci

# Read-only validation of the development artifact and its pinned vendored Core.

on:
  push:
    branches: [main, feature/v0.2.0]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-daemon:
    timeout-minutes: 15
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install --find-links vendor/wheels ".[test]"
      # macOS temporary paths can exceed the Unix socket address limit.
      - run: python -m pytest tests/unit/test_sysinfo.py tests/integration/test_process_lifecycle.py --basetemp=/tmp/nxc-tests -q --tb=short
        env:
          OKTO_NEXUS_CONNECTOR_VAULT: file
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Install Connector and its exact vendored Core dependency
        run: python -m pip install --find-links vendor/wheels ".[test]"
      - name: Lint boundaries (structural no-MCP audit)
        run: python -m pytest tests/unit/test_boundaries.py -q
      - name: Full suite
        run: python -m pytest tests/ -q --tb=short
        env:
          OKTO_NEXUS_CONNECTOR_VAULT: file

  build:
    needs: test
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python tools/build_artifacts.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7
