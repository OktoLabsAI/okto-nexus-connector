name: ci

# Read-only validation workflow (staged, mirrors the Core repo policy):
# hosted execution remains disabled pending the billing/authorization
# decision. Runners: Windows + Ubuntu across Python 3.11-3.13.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    if: false  # staged; enable after the billing decision
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core wheel
        run: |
          python -m pip install nexus-connector-core==0.1.0.dev0 \
            --find-links ./dist
      - name: Install connector
        run: python -m pip install -e .[test]
      - name: Lint boundaries (structural no-MCP audit)
        run: python -m pytest tests/unit/test_boundaries.py -q
      - name: Full suite
        run: python -m pytest tests/ -q --tb=short
        env:
          OKTO_NEXUS_CONNECTOR_VAULT: file

  build:
    if: false  # staged with test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
